- id: arrive_home_front_footpath_lights
  alias: Arrive Home - Front and Footpath Lights
  description: On arrival after dark, front + footpath lights to 100% for 15 min,
    then off (twice, Tuya misses). Footpath left alone if the daily automation already
    had it on.
  triggers:
  - trigger: state
    entity_id:
    - person.kieren
    - person.t
    from: not_home
    to: home
  conditions:
  - condition: sun
    after: sunset
    before: sunrise
  actions:
  - variables:
      footpath_was_on: '{{ is_state(''switch.footpath_lights'', ''on'') }}'
  - action: light.turn_on
    data:
      brightness_pct: 100
    target:
      entity_id: light.house_front
  - action: switch.turn_on
    target:
      entity_id: switch.footpath_lights
  - delay:
      minutes: 15
  - action: light.turn_off
    target:
      entity_id: light.house_front
  - if:
    - condition: template
      value_template: '{{ not footpath_was_on }}'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.footpath_lights
  - delay:
      minutes: 1
  - action: light.turn_off
    target:
      entity_id: light.house_front
  - if:
    - condition: template
      value_template: '{{ not footpath_was_on }}'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.footpath_lights
  mode: single
- id: wallpanel_motion_away_alert
  alias: Security - WallPanel motion while both away
  description: Time-sensitive push to Kieren's iPhone 17 and work iPhone when the
    WallPanel tablet's motion sensor fires while both Kieren and T are away. 10-minute
    cooldown, muted by turning off input_boolean.wallpanel_motion_alert_enabled. A
    cheap tripwire, not a replacement for a real alarm.
  triggers:
  - trigger: state
    entity_id: binary_sensor.my_wall_panel_motion_detected_2
    from: 'off'
    to: 'on'
  conditions:
  - alias: Alert is not muted
    condition: state
    entity_id: input_boolean.wallpanel_motion_alert_enabled
    state: 'on'
  - alias: At least 10 minutes since the last alert
    condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 600 }}'
  - alias: Both Kieren and T are away (a named zone counts as away; unknown/unavailable
      does not, so a dropped tracker never raises a false alarm)
    condition: template
    value_template: '{{ states(''person.kieren'') not in [''home'', ''unknown'', ''unavailable'']
      and states(''person.t'') not in [''home'', ''unknown'', ''unavailable''] }}'
  actions:
  - variables:
      alert_title: Motion detected at home
      alert_message: Wall panel saw motion at {{ now().strftime('%-I:%M %p') }} —
        nobody is home.
  - parallel:
    - action: notify.mobile_app_kierens_iphone_17
      data:
        title: '{{ alert_title }}'
        message: '{{ alert_message }}'
        data:
          push:
            interruption-level: time-sensitive
            sound: default
          tag: wallpanel-motion-away
          url: /wall-main
    - action: notify.mobile_app_kierens_work_iphone_15
      data:
        title: '{{ alert_title }}'
        message: '{{ alert_message }}'
        data:
          push:
            interruption-level: time-sensitive
            sound: default
          tag: wallpanel-motion-away
          url: /wall-main
  mode: single
- id: blueiris_stream_watchdog
  alias: Cameras - Blue Iris stream watchdog
  description: Reloads the Blue Iris integration when its camera images stop being
    real JPEGs. The integration bakes the BI session ID into each camera URL at entity
    creation and never refreshes it, so when BI invalidates the session the pictures
    silently become BI's login page. See packages/blueiris_stream_watchdog.yaml for
    the full explanation. Fires after 30s of failure, retries three times back to
    back, then every 5 minutes until the pictures come back.
  triggers:
  - trigger: state
    entity_id: binary_sensor.blue_iris_streams
    to: 'off'
    for: 00:00:30
  conditions:
  - condition: state
    entity_id: binary_sensor.blue_iris_streams
    state: 'off'
  actions:
  - repeat:
      sequence:
      - if:
        - condition: template
          value_template: '{{ repeat.index > 3 }}'
        then:
        - delay: 00:05:00
        - condition: state
          entity_id: binary_sensor.blue_iris_streams
          state: 'off'
      - action: homeassistant.reload_config_entry
        target:
          entity_id: camera.cameras_subfront
      - wait_template: '{{ is_state(''binary_sensor.blue_iris_streams'', ''on'') }}'
        timeout: 00:01:00
        continue_on_timeout: true
      until:
      - condition: state
        entity_id: binary_sensor.blue_iris_streams
        state: 'on'
  mode: single
  max_exceeded: silent
- id: cameras_pc_wake_on_power_restore
  alias: Power - Wake cameras PC when mains returns
  description: 'The EcoFlow never cuts its own output, so after NUT shuts the cameras
    PC down at 30% battery there is no AC transition for the BIOS AC Recovery setting
    to act on and the NVR stays off. This wakes it instead.


    THE HA START TRIGGER IS THE IMPORTANT ONE. In the dominant scenario HA is not
    running when mains returns - it was shut down with unRAID at 35% battery - so
    there is no transition for it to observe. It boots, finds everything already online,
    and would see nothing at all. So the automation checks on every start whether
    the NVR is reachable and wakes it if not.


    The second trigger only matters while HA stays up, i.e. a short outage. It watches
    the EcoFlow''s own AC-plugged-in flag over local BLE, which is measured at the
    unit itself. ''from: off'' is load bearing: it excludes unavailable -> on, so
    a BLE reconnect does not fire this. The 30s dwell guards against flapping at the
    moment power returns.


    HISTORY, 17 Sep 2026: this replaces two triggers on sensor.network_switch, the
    Meross "Network Cupboard" plug. That plug was taken out of the EcoFlow''s input
    path during the final rewiring, so both of its triggers were dead - one of them
    would have fired spuriously if the plug ever came back online. The EcoFlow BLE
    flag is a strictly better signal anyway.


    The 60s delay lets the ping sensor get a reading and gives the PC a chance to
    be booting on its own. It then presses only if the NVR is not confirmed up, and
    retries up to five times, 90s apart, until the ping answers.


    KNOWN BEHAVIOUR: if you shut the NVR down deliberately and HA restarts, this will
    wake it. Disable this automation first if that is not what you want.


    Requires, on the PC: BIOS WakeOnLan=LanOnly, DeepSleepCtrl=Disabled, and Windows
    Fast Startup OFF - Windows deliberately disables WoL on a hybrid-shutdown transition.
    All three set 12 Sep 2026.'
  triggers:
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: state
    entity_id: binary_sensor.ecoflow_ac_plugged_in
    from: 'off'
    to: 'on'
    for: 00:00:30
    id: mains_returned
  actions:
  - delay: 00:01:00
  - condition: template
    value_template: '{{ not is_state(''binary_sensor.cameras_pc_online'', ''on'')
      }}'
  - repeat:
      sequence:
      - action: button.press
        target:
          entity_id: button.wake_cameras_pc
      - wait_template: '{{ is_state(''binary_sensor.cameras_pc_online'', ''on'') }}'
        timeout: 00:01:30
        continue_on_timeout: true
      until:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.cameras_pc_online
          state: 'on'
        - condition: template
          value_template: '{{ repeat.index >= 5 }}'
  mode: single
  max_exceeded: silent
- id: kiosk_browser_watchdog
  alias: Kiosk - Restart browser when it loses its HA connection
  description: 'The mini-graph-card fuel chart wedges permanently if its history fetch
    HANGS rather than fails: updateOnInterval is guarded by `!this.updating`, `updating`
    is only cleared at the end of updateData, and the bundle contains no AbortController.
    Neither `update_interval` nor the default 2-hourly timer can recover it - only
    a page reload can.

    On 15 Sep a Wi-Fi adapter swap on the kiosk PC dropped the connection at 15:37.
    The browser reconnected at 15:40, dropped again at 15:51, and never came back:
    the chart sat on its spinner for 55 minutes while the PC itself answered SSH,
    RDP and SMB perfectly. Crucially browser_mod was unreachable that whole time,
    so browser_mod.refresh silently did nothing (it returns [] regardless). The HASS.Agent
    button DID work, because it rides MQTT rather than the frontend websocket - so
    that is what this automation uses.

    Deliberately triggers on browser_mod''s own liveness sensor rather than on anything
    about the chart, because this recovers any wedged-frontend symptom, not just that
    one card.'
  triggers:
  - trigger: state
    entity_id: sensor.kiosk_browser_id
    to: unavailable
    for: 00:10:00
    id: wedged
  - trigger: time_pattern
    minutes: /30
    id: retry
  conditions:
  - condition: template
    value_template: "{{ states('sensor.kiosk_browser_id') == 'unavailable'\n   and
      (now() - states.sensor.kiosk_browser_id.last_changed).total_seconds() > 600
      }}"
  - condition: template
    value_template: '{{ states(''button.kiosk_kioskfirefoxrestart'') != ''unavailable''
      }}'
  actions:
  - action: button.press
    target:
      entity_id: button.kiosk_kioskfirefoxrestart
  - action: logbook.log
    data:
      name: Kiosk browser watchdog
      entity_id: sensor.kiosk_browser_id
      message: Restarted Firefox on the kiosk PC - browser_mod had not seen the browser
        since {{ as_local(states.sensor.kiosk_browser_id.last_changed).strftime('%H:%M')
        }}.
  mode: single
  max_exceeded: silent
- id: go2rtc_substream_eof_watchdog
  alias: Cameras - go2rtc substream watchdog
  description: 'Recovers a frozen kiosk WebRTC camera pane caused by go2rtc''s ffmpeg
    RTSP producer dying on the five dual-lens "sub" streams. See kmbrimble/ha-config#22
    and claude/kiosk-camera-framerate.md.

    go2rtc can''t parse these cameras'' RTSP natively and falls back to an ffmpeg
    producer, which drops the connection with `error=EOF` every 5-15 minutes and
    reconnects. An isolated reconnect usually recovers on its own, but a burst of
    them tends to leave the kiosk''s WebRTC <video> element stuck on a stale frame,
    because nothing forces the browser to renegotiate. Neither blueiris_stream_watchdog
    (checks BI''s HTTP session, unrelated) nor kiosk_browser_watchdog (checks the
    browser_mod websocket, which stays up fine) can see this.

    sensor.go2rtc_substream_eof_bursts (packages/go2rtc_stream_watchdog.yaml) reports
    how many NEW go2rtc EOF log entries for these streams appeared in roughly the
    last 3 minutes. Two or more is treated as a burst worth recovering from. Reuses
    button.kiosk_kioskfirefoxrestart - the same HASS.Agent/MQTT button kiosk_browser_watchdog
    uses - which forces a fresh page load and makes the kiosk renegotiate its WebRTC
    connections. At least 10 minutes between presses so a stretch of ongoing churn
    does not restart the kiosk browser every 3 minutes.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.go2rtc_substream_eof_bursts
    above: 1
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 600 }}'
  actions:
  - action: button.press
    target:
      entity_id: button.kiosk_kioskfirefoxrestart
  - action: logbook.log
    data:
      name: go2rtc substream watchdog
      entity_id: sensor.go2rtc_substream_eof_bursts
      message: Restarted Firefox on the kiosk PC after {{ states('sensor.go2rtc_substream_eof_bursts')
        }} go2rtc EOF reconnects on the dual-lens substreams in the last ~3 minutes.
  mode: single
  max_exceeded: silent
- id: '1790350000001'
  alias: Master Bedroom - Timeshifter 4am wake (26 Sep 2026)
  description: >-
    One-off: starts the five-minute Master Bedroom Sunrise script at 04:00 on 26 Sep 2026
    (Timeshifter wake for the overseas trip), reaching full cool white at 04:05. The date
    condition makes it inert on every other day; change or remove it to reuse.
  triggers:
    - trigger: time
      at: '04:00:00'
  conditions:
    - condition: template
      value_template: "{{ now().strftime('%Y-%m-%d') == '2026-09-26' }}"
  actions:
    - action: script.master_bedroom_sunrise
  mode: single

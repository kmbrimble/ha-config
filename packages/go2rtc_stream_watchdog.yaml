# go2rtc WebRTC stream watchdog — health probe for the kiosk's dual-lens cameras
#
# The automation that uses this lives in automations.yaml
# ("Cameras - go2rtc substream watchdog") so it stays editable in the HA UI.
# Only the sensor lives here, because `command_line:` is a platform config and
# cannot be created in the UI.
#
# WHY THIS EXISTS — see kmbrimble/ha-config#22 and claude/kiosk-camera-framerate.md
# ---------------------------------------------------------------------------
# The Kiosk's five dual-lens "sub" camera panes (camera.bi_subsideyard,
# bi_subbottomyard, bi_subfront, bi_subtopyard, bi_subbackgate) are WebRTC via
# HA's built-in go2rtc. go2rtc can't parse these cameras' RTSP natively (H.264
# Main profile with weighted prediction, direct-to-wire from the camera's own
# ONVIF substream — go2rtc's demuxer chokes on it), so it falls back to an
# `ffmpeg:` producer. That ffmpeg producer's RTSP connection to Blue Iris dies
# with `error=EOF` roughly every 5-15 minutes and go2rtc reconnects it — ~200
# times in the first 32 hours after an HA restart. An isolated reconnect
# usually recovers on its own, but a burst of them tends to leave the kiosk's
# WebRTC <video> element stuck on a stale frame, because nothing forces the
# browser side to renegotiate.
#
# Neither existing camera watchdog would ever catch this:
# - `blueiris_stream_watchdog` only checks Blue Iris's own HTTP still-image
#   session (the unrelated `custom_components/blueiris` entities).
# - `kiosk_browser_watchdog` only checks that browser_mod's websocket is
#   connected — the websocket stays up fine while the video freezes.
#
# So this probe looks at the one place the problem actually shows up: HA's own
# log. `tools/go2rtc_eof_check.py` tails /config/home-assistant.log (read-only,
# from a saved byte offset) and counts the NEW lines that are a go2rtc WARNING
# naming one of these five streams, or a per-camera `stream` worker error. A
# burst of 2+ in one 3-minute window is the signal the automation acts on.
#
# History: until 28 Oct 2026 it read `system_log/list` instead. That dedupes
# to one cumulative `count` per source and keeps only 5 distinct messages, and
# the old script added the whole running total whenever any retained message
# named a sub camera - so the sensor read 67 ... 496 "per 3 minutes" and the
# watchdog restarted the kiosk's Firefox for no reason. The frontgate stream
# (about 11 EOFs/hour, ~30/hour in daylight) shares that source and is
# deliberately NOT counted here.
#
# Deliberately modelled on packages/blueiris_stream_watchdog.yaml's shape.

command_line:
  - sensor:
      name: go2rtc Substream EOF Bursts
      unique_id: go2rtc_substream_eof_bursts
      scan_interval: 180
      command_timeout: 15
      command: "python3 /config/tools/go2rtc_eof_check.py"
      value_template: "{{ value | int(0) }}"

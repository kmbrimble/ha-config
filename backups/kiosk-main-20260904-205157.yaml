          show_name: false
          show_state: false
          show_icon: false
          card_mod:
            style: |
              ha-card { aspect-ratio: 3 / 2; container-type: inline-size; }
          styles:
            card:
            - background-color: '#1a1a1a'
            - border-radius: 6px
            grid:
            - grid-template-areas: '"content"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr
            custom_fields:
              content:
              - justify-self: stretch
              - align-self: stretch
          custom_fields:
            content: |
              [[[
                return '<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; box-sizing:border-box; padding:8%; gap:2%; color:#eaff00; line-height:1;">'
                  + '<span style="font-size:13cqw; font-weight:400;">Living Room</span>'
                  + '<span style="font-size:23cqw; font-weight:700;">' + Number(entity.state).toFixed(1) + ' °C</span>'

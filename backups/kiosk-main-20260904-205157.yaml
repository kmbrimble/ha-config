kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
- title: Main
  path: main
  type: panel
  theme: catppuccin-mocha
  cards:
  - type: horizontal-stack
    card_mod:
      style: |
        :host { margin: 0 !important; padding: 0 !important; }
        div#root { margin: 0 !important; padding: 0 !important; gap: 0 !important; }
    cards:
    - type: iframe
      url: http://magicmirror.kiztigs.com/?v=2
      card_mod:
        style: |
          :host { width: 1720px !important; flex: 0 0 1720px !important; margin: 0 !important; height: 100vh !important; }
          ha-card { height: 100% !important; border: none; border-radius: 0; background: black !important; }
          iframe { height: 100% !important; border: none; }
    - type: vertical-stack
      card_mod:
        style: |
          :host {
            width: 447px !important;
            flex: 0 0 447px !important;
            margin: 0 !important;
            height: 100vh !important;
            background: black !important;
            padding: 20px !important;
            box-sizing: border-box;
            display: flex !important;
            flex-direction: column !important;
          }
          #root { height: 100% !important; }
          #root > hui-card:nth-last-child(4) { margin-top: auto !important; }
          ha-card { background: transparent !important; border: none; box-shadow: none; }
      cards:
      - type: conditional
        conditions:
        - entity: person.kieren
          state_not: home
        - entity: person.t
          state: home
        card:
          type: vertical-stack
          cards:
          - type: custom:button-card
            entity: person.kieren
            name: 'K:'
            show_state: true
            show_icon: false
            card_mod:
              style: |
                ha-card {
                  border: none !important;
                  box-shadow: inset 6px 0 0 0 orchid !important;
                }
            styles:
              card:
              - background-color: '#1a1a1a'
              - padding: 10px 25px
              - height: 40px
              - margin-bottom: 5px
              - border-radius: 6px
              grid:
              - grid-template-areas: '"n s"'
              - grid-template-columns: min-content 1fr
              - column-gap: 15px
              name:
              - justify-self: start
              - font-size: 30px
              - font-weight: 400
              - color: '#e0e0e0'
              - align-self: center
              state:
              - justify-self: start
              - font-size: 30px
              - font-weight: 700
              - color: orchid
              - align-self: center
          - type: custom:button-card
            entity: person.kieren
            show_name: false
            show_icon: false
            aspect_ratio: 1/1
            styles:
              card:
              - padding: 0
              - overflow: hidden
              - background: none
              - border: none
              custom_fields:
                map:
                - position: absolute
                - top: -50%
                - left: -50%
                - width: 200%
                - height: 200%
            custom_fields:
              map: |
                [[[
                  var lat = entity.attributes.latitude;
                  var lon = entity.attributes.longitude;
                  if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
                    return `<iframe src="http://maps.google.com/maps?q=${lat},${lon}&t=m&z=15&output=embed&iwloc=near" width="100%" height="100%" frameborder="0" style="border:0; pointer-events:none;"></iframe>`;
                  }
                  return `<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#222;color:#888;font-weight:bold;font-size:14px;">NO GPS DATA</div>`;
                ]]]
          - type: custom:button-card
            entity: person.t
            name: 'T:'
            show_state: true
            show_icon: false
            aspect_ratio: 1/1
            styles:
              card:
              - padding: 0
              - overflow: hidden
              - background: none
              - border: none
              custom_fields:
                map:
                - position: absolute
                - top: -50%
                - left: -50%
                - width: 200%
                - height: 200%
            custom_fields:
              map: |
                [[[
                  var lat = entity.attributes.latitude;
                  var lon = entity.attributes.longitude;
                  if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
                    return `<iframe src="http://maps.google.com/maps?q=${lat},${lon}&t=m&z=15&output=embed&iwloc=near" width="100%" height="100%" frameborder="0" style="border:0; pointer-events:none;"></iframe>`;
                  }
                  return `<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#222;color:#888;font-weight:bold;font-size:14px;">NO GPS DATA</div>`;
                ]]]

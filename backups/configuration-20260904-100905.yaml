homeassistant:
  packages: !include_dir_named packages
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 192.168.0.16
      allow_bypass_login: true
      trusted_users:
        192.168.0.16: cba460bfd5884d049c7e871642161216
    - type: homeassistant
  

      
# Loads default set of integrations. Do not remove.
default_config:

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

frontend:
  themes: !include_dir_merge_named themes
  # extra_module_url is FIRE-AND-FORGET — HA does not await these before rendering a dashboard.
  # Only modules that are not custom cards belong here: they patch the frontend itself and are
  # not referenced by a card's `type:`, so losing a race just delays their effect rather than
  # failing a card. Custom CARDS must go under `lovelace: resources:` below.
  extra_module_url:
    - /hacsfiles/kiosk-mode/kiosk-mode.js?v=1
    # card-mod stays HERE, not under `lovelace: resources:`. It is a global frontend patch like
    # kiosk-mode, not a card type. Moving it to resources on 2026-08-22 left the Kiosk layout
    # bistable — scrollWidth 3456 (overflowing the 3440 display) on some loads and a wrong
    # 1141px first card on others. Reverted; do not move it again.
    - /hacsfiles/lovelace-card-mod/card-mod.js?v=1
    - /hacsfiles/lovelace-wallpanel/wallpanel.js?v=1

lovelace:
  resource_mode: yaml
  # Custom card modules. HA loads these before building a dashboard, so a card's `type:` is
  # guaranteed to be registered by the time the view renders.
  #
  # These were previously in extra_module_url only, which is not awaited. That raced: on roughly
  # half of loads the Wall dashboard's 34 custom:button-card cards rendered "Configuration error"
  # because button-card had not registered yet. It was masked until 2026-08-22 by a slow
  # cdn.jsdelivr.net fetch in extra_module_url that happened to delay rendering; removing that
  # dead resource exposed the race.
  resources:
    - url: /hacsfiles/button-card/button-card.js?v=1
      type: module
    - url: /hacsfiles/stack-in-card/stack-in-card.js?v=1
      type: module
    - url: /hacsfiles/lovelace-layout-card/layout-card.js?v=1
      type: module
    - url: /hacsfiles/slider-button-card/slider-button-card.js?v=1
      type: module
    - url: /hacsfiles/lovelace-hue-like-light-card/hue-like-light-card.js?v=1
      type: module
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js?v=1
      type: module
    - url: /hacsfiles/weather-radar-card/weather-radar-card.js?v=1
      type: module
  dashboards:
    kiosk-main:
      mode: yaml
      title: Kiosk
      icon: mdi:monitor-dashboard
      show_in_sidebar: true
      filename: dashboards/kiosk-main.yaml
    kiosk-candidate:
      mode: yaml
      title: Kiosk (candidate)
      icon: mdi:monitor-dashboard
      show_in_sidebar: false
      filename: dashboards/kiosk-candidate.yaml
    wall-main:
      mode: yaml
      title: Wall
      icon: mdi:tablet-dashboard
      show_in_sidebar: true
      filename: dashboards/wall-main.yaml
    wall-candidate:
      mode: yaml
      title: Wall (candidate)
      icon: mdi:tablet-dashboard
      show_in_sidebar: false
      filename: dashboards/wall-candidate.yaml

smartir:

climate:
  - platform: smartir
    name: Living Room AC
    unique_id: living_room_ac
    device_code: 1291
    controller_data: remote.downstairs_living_remote
    temperature_sensor: sensor.downstairs_living_remote_temperature
    humidity_sensor: sensor.downstairs_living_remote_humidity
    power_sensor: binary_sensor.ac_power
  - platform: smartir
    name: Bedroom AC
    unique_id: mainbed_ac
    device_code: 1291
    controller_data: remote.bedroom_remote
    temperature_sensor: sensor.bedroom_remote_temperature
    humidity_sensor: sensor.bedroom_remote_humidity
    power_sensor: binary_sensor.ac_power

sensor:
  - platform: time_date
    display_options:
      - time

  # 24h Peak Power Tracker (Purely for interest/stats)
  - platform: statistics
    name: "Grid Power Peak (24h)"
    unique_id: grid_power_peak_24h
    entity_id: sensor.emerald_grid_power_usage
    state_characteristic: value_max
    max_age:
      hours: 24
      
recorder:
  db_url: !secret mariadb_recorder_url
  
template:
  - trigger:
      - platform: mqtt
        topic: "home/emerald/energy/pulses"
    sensor:
      - name: "Total Grid Energy"
        unique_id: "emerald_accumulator_kwh"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:lightning-bolt-circle
        state: >
          {# 1. Get the new pulses from the MQTT message #}
          {% set new_pulses = trigger.payload | int(0) %}
          
          {# 2. Convert to kWh (1000 pulses = 1 kWh) #}
          {% set new_kwh = new_pulses / 1000.0 %}
          
          {# 3. Add to the existing total #}
          {{ (this.state | float(0)) + new_kwh }}

  # Dining Table plug is still Tuya Cloud, so it keeps its kWh wrapper.
  # The other Arlec plugs now use their Tuya Local energy sensors directly.
  - sensor:

      - name: "Dining Table Energy"
        unique_id: dining_table_energy_fixed
        state: "{{ states('sensor.dining_table_total_energy') }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

mqtt:
  sensor:
    # 1. Real-time Power Draw (For Graphs/Instant view)
    - name: "Grid Power Usage"
      unique_id: "emerald_power_watts"
      state_topic: "home/emerald/power/watts"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    # 2. Pulse Count (Raw data from device)
    - name: "Grid Pulse Count"
      unique_id: "emerald_energy_pulses"
      state_topic: "home/emerald/energy/pulses"
      state_class: total
      unit_of_measurement: "pulses"

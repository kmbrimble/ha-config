kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
- title: Main
  path: main
  type: panel
  theme: catppuccin-mocha
  cards:
  - type: horizontal-stack
    card_mod:
      style: |
        :host { margin: 0 !important; padding: 0 !important; }
        div#root { margin: 0 !important; padding: 0 !important; gap: 0 !important; }
    cards:
    - type: iframe
      url: http://magicmirror.kiztigs.com/?v=2
      card_mod:
        style: |
          :host { width: 1720px !important; flex: 0 0 1720px !important; margin: 0 !important; height: 100vh !important; }
          ha-card { height: 100% !important; border: none; border-radius: 0; background: black !important; }
          iframe { height: 100% !important; border: none; }
    - type: vertical-stack
      card_mod:
        style: |
          :host {
            width: 447px !important;
            flex: 0 0 447px !important;
            margin: 0 !important;
            height: 100vh !important;
            background: black !important;
            padding: 20px !important;
            box-sizing: border-box;
            display: flex !important;
            flex-direction: column !important;
          }
          #root { height: 100% !important; justify-content: flex-end !important; }
          ha-card { background: transparent !important; border: none; box-shadow: none; }
      cards:
      - type: conditional
        conditions:
        - entity: person.kieren
          state_not: home
        - entity: person.t
          state: home
        card:
          type: vertical-stack
          cards:
          - type: custom:button-card
            entity: person.kieren
            name: 'K:'
            show_state: true
            show_icon: false
            card_mod:
              style: |
                ha-card {
                  border: none !important;
                  box-shadow: inset 6px 0 0 0 orchid !important;
                }
            styles:
              card:
              - background-color: '#1a1a1a'
              - padding: 10px 25px
              - height: 40px
              - margin-bottom: 5px
              - border-radius: 6px
              grid:
              - grid-template-areas: '"n s"'
              - grid-template-columns: min-content 1fr
              - column-gap: 15px
              name:
              - justify-self: start
              - font-size: 30px
              - font-weight: 400
              - color: '#e0e0e0'
              - align-self: center
              state:
              - justify-self: start
              - font-size: 30px
              - font-weight: 700
              - color: orchid
              - align-self: center
          - type: custom:button-card
            entity: person.kieren
            show_name: false
            show_icon: false
            aspect_ratio: 1/1
            styles:
              card:
              - padding: 0
              - overflow: hidden
              - background: none
              - border: none
              custom_fields:
                map:
                - position: absolute
                - top: -50%
                - left: -50%
                - width: 200%
                - height: 200%
            custom_fields:
              map: |
                [[[
                  var lat = entity.attributes.latitude;
                  var lon = entity.attributes.longitude;
                  if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
                    return `<iframe src="http://maps.google.com/maps?q=${lat},${lon}&t=m&z=15&output=embed&iwloc=near" width="100%" height="100%" frameborder="0" style="border:0; pointer-events:none;"></iframe>`;
                  }
                  return `<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#222;color:#888;font-weight:bold;font-size:14px;">NO GPS DATA</div>`;
                ]]]
          - type: custom:button-card
            entity: person.t
            name: 'T:'
            show_state: true
            show_icon: false
            aspect_ratio: 1/1
            styles:
              card:
              - padding: 0
              - overflow: hidden
              - background: none
              - border: none
              custom_fields:
                map:
                - position: absolute
                - top: -50%
                - left: -50%
                - width: 200%
                - height: 200%
            custom_fields:
              map: |
                [[[
                  var lat = entity.attributes.latitude;
                  var lon = entity.attributes.longitude;
                  if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
                    return `<iframe src="http://maps.google.com/maps?q=${lat},${lon}&t=m&z=15&output=embed&iwloc=near" width="100%" height="100%" frameborder="0" style="border:0; pointer-events:none;"></iframe>`;
                  }
                  return `<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#222;color:#888;font-weight:bold;font-size:14px;">NO GPS DATA</div>`;
                ]]]
      - type: conditional
        conditions:
        - entity: person.t
          state_not: home
        - entity: person.kieren
          state: home
        card:
          type: vertical-stack
          cards:
          - type: custom:button-card
            entity: person.t
            name: 'T:'
            show_state: true
            show_icon: false
            card_mod:
              style: |
                ha-card {
                  border: none !important;
                  box-shadow: inset 6px 0 0 0 orchid !important;
                }
            styles:
              card:
              - background-color: '#1a1a1a'
              - padding: 10px 25px
              - height: 40px
              - margin-bottom: 5px
              - border-radius: 6px
              grid:
              - grid-template-areas: '"n s"'
              - grid-template-columns: min-content 1fr
              - column-gap: 15px
              name:
              - justify-self: start
              - font-size: 30px
              - font-weight: 400
              - color: '#e0e0e0'
              - align-self: center
              state:
              - justify-self: start
              - font-size: 30px
              - font-weight: 700
              - color: orchid
              - align-self: center
          - type: custom:button-card
            entity: person.t
            show_name: false
            show_icon: false
            aspect_ratio: 1/1
            styles:
              card:
              - padding: 0
              - overflow: hidden
              - background: none
              - border: none
              custom_fields:
                map:
                - position: absolute
                - top: -50%
                - left: -50%
                - width: 200%
                - height: 200%
            custom_fields:
              map: |
                [[[
                  var lat = entity.attributes.latitude;
                  var lon = entity.attributes.longitude;
                  if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
                    return `<iframe src="http://maps.google.com/maps?q=${lat},${lon}&t=m&z=15&output=embed&iwloc=near" width="100%" height="100%" frameborder="0" style="border:0; pointer-events:none;"></iframe>`;
                  }
                  return `<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#222;color:#888;font-weight:bold;font-size:14px;">NO GPS DATA</div>`;
                ]]]
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          entity: sensor.downstairs_living_remote_temperature
          show_name: false
          show_state: false
          show_icon: false
          card_mod:
            style: |
              ha-card { aspect-ratio: 1 / 1; container-type: inline-size; }
          styles:
            card:
            - background-color: '#1a1a1a'
            - border-radius: 6px
            grid:
            - grid-template-areas: '"content"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr
            custom_fields:
              content:
              - justify-self: stretch
              - align-self: stretch
          custom_fields:
            content: |
              [[[
                return '<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; box-sizing:border-box; padding:8%; gap:4%; color:#eaff00; font-size:23cqw; font-weight:700; line-height:1;">'
                  + '<ha-icon icon="mdi:thermometer" style="--mdc-icon-size:34cqw;"></ha-icon>'
                  + '<span>' + Number(entity.state).toFixed(1) + ' °C</span>'
                  + '</div>';
              ]]]
        - type: custom:button-card
          entity: sensor.downstairs_living_remote_humidity
          show_name: false
          show_state: false
          show_icon: false
          card_mod:
            style: |
              ha-card { aspect-ratio: 1 / 1; container-type: inline-size; }
          styles:
            card:
            - background-color: '#1a1a1a'
            - border-radius: 6px
            grid:
            - grid-template-areas: '"content"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr
            custom_fields:
              content:
              - justify-self: stretch
              - align-self: stretch
          custom_fields:
            content: |
              [[[
                return '<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; box-sizing:border-box; padding:8%; gap:4%; color:#26c6da; font-size:23cqw; font-weight:700; line-height:1;">'
                  + '<ha-icon icon="mdi:water-percent" style="--mdc-icon-size:34cqw;"></ha-icon>'
                  + '<span>' + Math.round(Number(entity.state)) + ' %</span>'
                  + '</div>';
              ]]]
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          entity: sensor.kenmore_fuel_ampol_foodary_kenmore_unleaded_95
          name: Kenmore
          show_state: false
          show_icon: false
          variables:
            prev_entity: sensor.kenmore_fuel_previous_price
          styles:
            card:
            - background-color: '#1a1a1a'
            - border-radius: 6px
            - padding: 8px 10px
            - height: 90px
            grid:
            - grid-template-areas: '"n" "price" "ts"'
            - grid-template-rows: min-content min-content min-content
            - grid-template-columns: 1fr
            - row-gap: 0px
            name:
            - justify-self: start
            - align-self: start
            - font-size: 20px
            - font-weight: 400
            - color: '#e0e0e0'
            custom_fields:
              price:
              - justify-self: start
              - align-self: center
              - font-size: 28px
              - font-weight: 700
              - color: '#4fc3f7'
              ts:
              - justify-self: start
              - align-self: start
              - font-size: 11px
              - font-weight: 400
              - color: '#808080'
          custom_fields:
            price: |
              [[[
                var cur = Number(entity.state);
                var priceStr = '$' + (cur / 100).toFixed(3);
                var prevState = states[variables.prev_entity];
                var prev = prevState ? Number(prevState.state) : NaN;
                var arrow = '';
                if (!isNaN(prev) && prev > 0 && cur > 0 && cur !== prev) {
                  arrow = cur > prev
                    ? '<span style="color:#ff5252; font-size:0.5em; margin-left:8px;">&#9650;</span>'
                    : '<span style="color:#69f0ae; font-size:0.5em; margin-left:8px;">&#9660;</span>';
                }
                return priceStr + arrow;
              ]]]
            ts: |
              [[[
                var d = new Date(entity.last_changed);
                var opts = { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Australia/Brisbane' };
                return 'Updated ' + d.toLocaleString('en-AU', opts);
              ]]]
        - type: custom:button-card
          entity: sensor.sunnybank_fuel_7_eleven_acacia_ridge_east_unleaded_95
          name: Sunnybank
          show_state: false
          show_icon: false
          variables:
            prev_entity: sensor.sunnybank_fuel_previous_price
          styles:
            card:
            - background-color: '#1a1a1a'
            - border-radius: 6px
            - padding: 8px 10px
            - height: 90px
            grid:
            - grid-template-areas: '"n" "price" "ts"'
            - grid-template-rows: min-content min-content min-content
            - grid-template-columns: 1fr
            - row-gap: 0px
            name:
            - justify-self: start
            - align-self: start
            - font-size: 20px
            - font-weight: 400
            - color: '#e0e0e0'
            custom_fields:
              price:
              - justify-self: start
              - align-self: center
              - font-size: 28px
              - font-weight: 700
              - color: '#ffb74d'
              ts:
              - justify-self: start
              - align-self: start
              - font-size: 11px
              - font-weight: 400
              - color: '#808080'
          custom_fields:
            price: |
              [[[
                var cur = Number(entity.state);
                var priceStr = '$' + (cur / 100).toFixed(3);
                var prevState = states[variables.prev_entity];
                var prev = prevState ? Number(prevState.state) : NaN;
                var arrow = '';
                if (!isNaN(prev) && prev > 0 && cur > 0 && cur !== prev) {
                  arrow = cur > prev
                    ? '<span style="color:#ff5252; font-size:0.5em; margin-left:8px;">&#9650;</span>'
                    : '<span style="color:#69f0ae; font-size:0.5em; margin-left:8px;">&#9660;</span>';
                }
                return priceStr + arrow;
              ]]]
            ts: |
              [[[
                var d = new Date(entity.last_changed);
                var opts = { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Australia/Brisbane' };
                return 'Updated ' + d.toLocaleString('en-AU', opts);
              ]]]
      - type: custom:apexcharts-card
        card_mod:
          style: |
            :host { margin-top: 8px !important; }
            ha-card {
              background: #1a1a1a !important;
              border-radius: 6px !important;
              border: none !important;
              box-shadow: none !important;
            }
        header:
          show: false
        graph_span: 14d
        chart_type: line
        yaxis:
        - decimals: 2
          min: '|-0.1|'
          max: '|+0.1|'
        apex_config:
          chart:
            height: 200
            toolbar:
              show: false
          legend:
            show: false
          grid:
            show: true
            borderColor: '#333333'
          xaxis:
            labels:
              format: dd/MM
              style:
                colors: '#808080'
                fontSize: '10px'
          yaxis:
          - labels:
              style:
                colors: '#808080'
                fontSize: '10px'
        series:
        - entity: sensor.kenmore_fuel_ampol_foodary_kenmore_unleaded_95
          name: Kenmore
          color: '#4fc3f7'
          stroke_width: 2
          curve: stepline
          transform: return x / 100;
        - entity: sensor.sunnybank_fuel_7_eleven_acacia_ridge_east_unleaded_95
          name: Sunnybank
          color: '#ffb74d'
          stroke_width: 2
          curve: stepline
          transform: return x / 100;
    - type: vertical-stack
      card_mod:
        style: ":host { \n  width: 1273px !important; \n  flex: 0 0 1273px !important; \n  margin: 0 !important; \n  height: 100vh !important; \n  background: black !important;\n  --vertical-stack-card-gap: 0px;\n}\n"
      cards:
      - type: picture-entity
        entity: camera.cameras_subfront
        camera_view: live
        show_name: false
        show_state: false
        card_mod:
          style: "ha-card { \n  height: 25vh !important; \n  border-radius: 0px !important; \n  border: none !important; \n  margin: 0px !important; \n  box-shadow: none !important; \n  background: black !important;\n}\n"
      - type: picture-entity
        entity: camera.cameras_subsideyard
        camera_view: live
        show_name: false
        show_state: false
        card_mod:
          style: "ha-card { \n  height: 25vh !important; \n  border-radius: 0px !important; \n  border: none !important; \n  margin: 0px !important; \n  box-shadow: none !important; \n  background: black !important;\n}\n"
      - type: horizontal-stack
        card_mod:
          style: |
            :host {
              --horizontal-stack-card-gap: 0px;
              background: black !important;
            }
        cards:
        - type: picture-entity
          entity: camera.cameras_subbottomyard
          camera_view: live
          show_name: false
          show_state: false
          card_mod:
            style: "ha-card { \n  height: 25vh !important; \n  border-radius: 0px !important; \n  border: none !important; \n  margin: 0px !important; \n  box-shadow: none !important; \n  background: black !important;\n}\n"
        - type: picture-entity
          entity: camera.cameras_subtopyard
          camera_view: live
          show_name: false
          show_state: false
          card_mod:
            style: "ha-card { \n  height: 25vh !important; \n  border-radius: 0px !important; \n  border: none !important; \n  margin: 0px !important; \n  box-shadow: none !important; \n  background: black !important;\n}\n"
      - type: horizontal-stack
        card_mod:
          style: |
            :host {
              --horizontal-stack-card-gap: 0px;
              background: black !important;
            }
        cards:
        - type: picture-entity
          entity: camera.cameras_subbackgate
          camera_view: live
          show_name: false
          show_state: false
          card_mod:
            style: "ha-card { \n  height: 25vh !important; \n  border-radius: 0px !important; \n  border: none !important; \n  margin: 0px !important; \n  box-shadow: none !important; \n  background: black !important;\n}\n"
        - type: picture-entity
          entity: camera.cameras_front_gate
          camera_view: live
          show_name: false
          show_state: false
          card_mod:
            style: "ha-card { \n  height: 25vh !important; \n  border-radius: 0px !important; \n  border: none !important; \n  margin: 0px !important; \n  box-shadow: none !important; \n  background: black !important;\n}\n"

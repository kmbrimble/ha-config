                  return `<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#222;color:#888;font-weight:bold;font-size:14px;">NO GPS DATA</div>`;
                ]]]
      # ENERGY USAGE, issue #16. Last 14 complete days of Nectr usage as stacked columns (grid,
      # then controlled load on top), solar export as a negative column, and reference lines at
      # the all-history daily min and max (solid) and average (dashed) of grid + controlled load.
      #
      # The plan is single-rate, so there is no peak/shoulder/off-peak split to show; the issue's
      # four tariff segments collapse to grid + controlled load.
      #
      # All six series get their data from window.kioskEnergy (www/kiosk-energy.js, loaded as a
      # lovelace resource), which reads the nectr integration's external statistics. `entity` is
      # only a carrier - apexcharts-card requires one - and a state change on it triggers a refresh.
      # The window ends at yesterday because Nectr publishes a day's usage the next day.
      #
      # Tick/label alignment: apexcharts-card ALWAYS forces the x-axis's min/max to exactly
      # [start, end] of this span, no matter what any series' data contains — pinning a series'
      # own points (e.g. the reference lines below) cannot change that. So alignment is won here,
      # not in kiosk-energy.js:
      #   - graph_span 13d + offset -2d makes [start, end] = [yesterday minus 13 days, yesterday],
      #     both exactly local midnight - the same instants kiosk-energy.js puts its bars on. That
      #     is 14 calendar days inclusive (yesterday minus 13 days, through yesterday itself).
      #   - xaxis.type: numeric (not the datetime this card defaults to) because ApexCharts
      #     explicitly ignores tickAmount on a datetime x-axis; ticks on an unforced datetime axis
      #     are an auto-picked count evenly subdividing [start, end] with NO date-rounding, which
      #     is the original bug (bars off by 12h) and, it turns out, not fixable by choosing a
      #     cleverer offset - it needs a real per-day tick count.
      #   - tickAmount: 13 forces exactly 14 ticks (13 intervals), evenly dividing the exact 13-day
      #     range into 1-day steps - each one lands precisely on a bar's midnight.
      #   - offset -2d rather than -1d specifically so the axis max is yesterday's midnight, not
      #     today's: a forced tickAmount always puts a tick at both axis ends, so if max were
      #     today, today would always get a tick/label - with no column under it once, again.
      - type: custom:apexcharts-card
        card_mod:
          style: |
            ha-card {
              background: #1a1a1a !important;
              border-radius: 6px !important;
              border: none !important;
              box-shadow: none !important;
            }
        graph_span: 13d
        span:
          end: day
          offset: -2d
        stacked: true
        update_interval: 30min
        header:
          show: true
          title: Daily energy (kWh)
          show_states: false
        yaxis:
        - decimals: 0
          apex_config:
            tickAmount: 5
        apex_config:
          chart:
            height: 229
            background: transparent
            animations:
              enabled: false
          plotOptions:
            bar:
              # 47% = twice the old per-series bar. The 70% slot used to be split three ways,
              # one group per column series; with one stack group the column gets all of it.
              columnWidth: 47%
          dataLabels:
            enabled: false
          tooltip:
            enabled: false
          legend:
            show: true
            position: bottom
            fontSize: 13px
            # One stack group makes ApexCharts cluster the legend vertically (3 rows, ~69px),
            # which squeezed the plot. Keep it on one row as before.
            clusterGroupedSeries: false
          xaxis:
            type: numeric
            tickAmount: 13
            labels:
              # Single capital day-of-week letter (M T W T F S S), not the date-of-month.
              # `value` is the raw tick ms (a local midnight - see the span/tickAmount comment
              # above); EVAL: is apexcharts-card's mechanism for a real JS function in apex_config.
              # Rounded to the nearest minute: ApexCharts computes 14 evenly-spaced ticks by
              # floating-point division, and the last one lands a fraction of a millisecond short
              # of true midnight (observed 1789567199999.96, 0.04ms early) - just enough for
              # new Date(...).getDay() to read the wrong side of midnight and show the wrong letter.
              formatter: 'EVAL:function(value) { return "SMTWTFS"[new Date(Math.round(value / 60000) * 60000).getDay()]; }'
          grid:
            borderColor: '#333'
        # stack_group: without it ApexCharts gives each column series its own stack group (one per
        # generated y-axis, `apexcharts-axis-N`), so grid, controlled load and export were drawn
        # side by side instead of stacked in one column with export directly underneath.
        series:
        - entity: sensor.power_nectr_a_6cffe20e_grid_consumption
          name: Grid
          type: column
          stack_group: usage
          show:
            legend_value: false
          color: 'orchid'
          data_generator: return window.kioskEnergy.series(hass, 'grid', start, end);
        - entity: sensor.power_nectr_a_6cffe20e_grid_consumption
          name: Controlled load
          type: column
          stack_group: usage
          show:
            legend_value: false
          color: '#4fc3f7'
          data_generator: return window.kioskEnergy.series(hass, 'controlled_load', start, end);
        - entity: sensor.power_nectr_a_6cffe20e_grid_consumption
          name: Solar export
          type: column
          stack_group: usage
          show:
            legend_value: false
          color: '#ffb74d'
          data_generator: return window.kioskEnergy.series(hass, 'export', start, end);
        - entity: sensor.power_nectr_a_6cffe20e_grid_consumption
          name: Max
          type: line
          color: '#e0e0e0'
          stroke_width: 1.5
          stroke_dash: 0
          # apexcharts-card extends line series to the raw window edge by default (extend_to:
          # 'end'), regardless of what data_generator returns. That silently re-added a point past
          # the last real bar, dragging the x-axis's own min/max back out past yesterday and
          # undoing the point of pinning this line to the first/last visible bar in kiosk-energy.js.
          extend_to: false
          show:
            in_legend: false
            legend_value: false
          data_generator: return window.kioskEnergy.series(hass, 'max', start, end);
        - entity: sensor.power_nectr_a_6cffe20e_grid_consumption
          name: Min
          type: line
          color: '#e0e0e0'
          stroke_width: 1.5
          stroke_dash: 0
          extend_to: false
          show:
            in_legend: false
            legend_value: false
          data_generator: return window.kioskEnergy.series(hass, 'min', start, end);
        - entity: sensor.power_nectr_a_6cffe20e_grid_consumption
          name: Average
          type: line
          color: '#e0e0e0'
          stroke_width: 1.5
          stroke_dash: 6
          extend_to: false
          show:
            in_legend: false
            legend_value: false
          data_generator: return window.kioskEnergy.series(hass, 'avg', start, end);
      - type: custom:button-card
        entity: sensor.lower_deck_temperature
        show_name: false
        show_state: false
        show_icon: false
        variables:
          hum_entity: sensor.lower_deck_humidity
        card_mod:
          style: |
            ha-card { height: 106px; container-type: inline-size; }
        styles:
          card:
          - background-color: '#1a1a1a'
          - border-radius: 6px
          grid:
          - grid-template-areas: '"content"'
          - grid-template-columns: 1fr
          - grid-template-rows: 1fr
          custom_fields:
            content:
            - justify-self: stretch
            - align-self: stretch
        custom_fields:
          content: |
            [[[
              var hs = states[variables.hum_entity];
              var hum = (hs && !isNaN(Number(hs.state))) ? Number(hs.state).toFixed(0) + ' %' : '--';
              var temp = !isNaN(Number(entity.state)) ? Number(entity.state).toFixed(1) + ' °C' : '--';
              return '<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; box-sizing:border-box; padding:4% 0; gap:3%; color:#ff8ad9; line-height:1;">'
                + '<span style="font-size:6.4cqw; font-weight:400;">Outside</span>'
                + '<div style="display:flex; width:100%; gap:8px; align-items:baseline;">'
                + '<span style="flex:1 1 0; text-align:center; font-size:11.3cqw; font-weight:700;">' + temp + '</span>'
                + '<span style="flex:1 1 0; text-align:center; font-size:11.3cqw; font-weight:700;">' + hum + '</span>'
                + '</div>'
                + '</div>';
            ]]]
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          entity: sensor.downstairs_living_remote_temperature
          show_name: false
          show_state: false
          show_icon: false
          card_mod:
            style: |
